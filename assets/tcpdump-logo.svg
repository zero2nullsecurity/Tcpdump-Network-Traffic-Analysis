
<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="180"
     viewBox="0 0 500 180">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="180" rx="20" fill="url(#bg)"/>

  <!-- Network connections -->
  <g stroke="url(#blue)" stroke-width="4" fill="none"
     stroke-linecap="round">
    <path d="M55 90 L105 45 L155 90 L105 135 Z"/>
    <path d="M55 90 H155"/>
    <path d="M105 45 V135"/>
    <path d="M155 90 L185 90"/>
  </g>

  <!-- Network nodes -->
  <g fill="#22c55e" stroke="#dcfce7" stroke-width="2">
    <circle cx="55" cy="90" r="10"/>
    <circle cx="105" cy="45" r="10"/>
    <circle cx="155" cy="90" r="10"/>
    <circle cx="105" cy="135" r="10"/>
  </g>

  <!-- Main title -->
  <text x="205" y="83"
        font-family="Arial, sans-serif"
        font-size="39"
        font-weight="bold"
        fill="#f8fafc">
    TCPDUMP
  </text>

  <!-- Subtitle -->
  <text x="208" y="112"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="600"
        letter-spacing="2"
        fill="#38bdf8">
    NETWORK TRAFFIC ANALYSIS
  </text>

  <!-- Bottom line -->
  <path d="M208 128 H440"
        stroke="#334155"
        stroke-width="2"/>

  <text x="208" y="148"
        font-family="Arial, sans-serif"
        font-size="10"
        letter-spacing="2"
        fill="#94a3b8">
    CAPTURE • FILTER • ANALYZE
  </text>

</svg>
